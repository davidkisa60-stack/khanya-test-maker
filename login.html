<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khanya Test Maker • Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: Inter, system-ui, sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <div class="flex justify-center mb-8">
                <div class="flex flex-col items-center">
                    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="60" cy="60" r="55" fill="#166534"/>
                        <path d="M30 45 L60 30 L90 45 L60 60 Z" fill="#4ade80"/>
                        <rect x="55" y="55" width="10" height="25" fill="#4ade80"/>
                        <path d="M60 80 Q70 85 80 80" fill="none" stroke="#4ade80" stroke-width="4"/>
                        <rect x="38" y="70" width="44" height="22" rx="2" fill="#166534"/>
                        <line x1="60" y1="70" x2="60" y2="92" stroke="#4ade80" stroke-width="2"/>
                    </svg>
                    <div class="mt-3 text-center">
                        <div class="text-3xl font-semibold tracking-tight">Khanya</div>
                        <div class="text-emerald-400 text-sm -mt-1">Test Maker</div>
                    </div>
                </div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-semibold">Sign in</h1>
                    <p class="text-zinc-400 mt-1 text-sm">Use the email an admin has activated for you</p>
                </div>

                <form id="login-form">
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-zinc-300 mb-2" for="login-email">Email Address</label>
                        <div class="relative">
                            <input
                                type="email"
                                id="login-email"
                                required
                                autocomplete="username"
                                placeholder="you@school.edu.ls"
                                class="w-full bg-zinc-950 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-4 py-3 text-white placeholder-zinc-500 focus:outline-none">
                            <i class="fa-solid fa-envelope absolute right-4 top-4 text-zinc-500"></i>
                        </div>
                    </div>

                    <button
                        type="submit"
                        id="login-btn"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 transition-colors text-white font-semibold py-3 rounded-2xl flex items-center justify-center gap-x-2">
                        <i class="fa-solid fa-sign-in-alt"></i>
                        <span>Continue</span>
                    </button>
                </form>

                <div id="login-error" class="hidden mt-4 p-3 bg-red-900/30 border border-red-700 text-red-400 text-sm rounded-2xl"></div>

                <div class="mt-6 text-center space-y-2">
                    <p class="text-xs text-zinc-500">Only activated emails can open the test builder.</p>
                    <a href="admin.html" class="text-xs text-emerald-400 hover:text-emerald-300">Admin panel →</a>
                </div>
            </div>

            <div class="text-center mt-6">
                <p class="text-xs text-zinc-500">© Khanya Test Maker 2026</p>
            </div>
        </div>
    </div>

    <script>
        function getStoredUser() {
            try {
                var raw = localStorage.getItem('khanya_user');
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        (function redirectIfAlreadyIn() {
            var user = getStoredUser();
            if (user && user.email) {
                window.location.replace('index.html');
            }
        })();

        function showError(msg) {
            var el = document.getElementById('login-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            var errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');

            var email = document.getElementById('login-email').value.trim().toLowerCase();
            var btn = document.getElementById('login-btn');
            btn.disabled = true;

            try {
                var res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                var data = {};
                try { data = await res.json(); } catch (err) { data = {}; }

                if (res.ok && data.success) {
                    localStorage.setItem('khanya_user', JSON.stringify({
                        email: data.email,
                        active: data.active,
                        role: data.role || 'user',
                        token: data.token || ''
                    }));
                    window.location.href = 'index.html';
                    return;
                }

                showError(data.message || 'This email cannot sign in.');
            } catch (err) {
                showError('Cannot reach the server. On Render this project must be a Web Service running app.py, not a Static Site.');
            } finally {
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
