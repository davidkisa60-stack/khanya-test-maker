<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khanya Test Maker • Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .khanya-logo {
            width: 120px;
            height: 120px;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <div class="flex flex-col items-center">
                    <!-- Khanya Logo SVG -->
                    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" class="khanya-logo">
                        <!-- Background circle -->
                        <circle cx="60" cy="60" r="55" fill="#166534"/>
                        <!-- Graduation cap -->
                        <path d="M30 45 L60 30 L90 45 L60 60 Z" fill="#4ade80"/>
                        <rect x="55" y="55" width="10" height="25" fill="#4ade80"/>
                        <path d="M60 80 Q70 85 80 80" fill="none" stroke="#4ade80" stroke-width="4"/>
                        <!-- Book -->
                        <rect x="38" y="70" width="44" height="22" rx="2" fill="#166534"/>
                        <line x1="60" y1="70" x2="60" y2="92" stroke="#4ade80" stroke-width="2"/>
                    </svg>
                    <div class="mt-3 text-center">
                        <div class="text-3xl font-semibold tracking-tight">Khanya</div>
                        <div class="text-emerald-400 text-sm -mt-1">Test Maker</div>
                    </div>
                </div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-semibold">Welcome back</h1>
                    <p class="text-zinc-400 mt-1 text-sm">Sign in to access the test builder</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-zinc-300 mb-2">Email Address</label>
                        <div class="relative">
                            <input 
                                type="email" 
                                id="login-email" 
                                required
                                value="admin@khanya.test"
                                placeholder="you@school.edu.ls"
                                class="w-full bg-zinc-950 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-4 py-3 text-white placeholder-zinc-500 focus:outline-none">
                            <i class="fa-solid fa-envelope absolute right-4 top-4 text-zinc-500"></i>
                        </div>
                    </div>

                    <button 
                        type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 transition-colors text-white font-semibold py-3 rounded-2xl flex items-center justify-center gap-x-2">
                        <i class="fa-solid fa-sign-in-alt"></i>
                        <span>Sign In</span>
                    </button>
                </form>

                <!-- BIG Quick Admin Access -->
                <div class="mt-5 pt-4 border-t border-zinc-700">
                    <button onclick="quickAdminLogin()" 
                            class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-semibold py-3 rounded-2xl flex items-center justify-center gap-x-2 text-sm shadow-lg">
                        <i class="fa-solid fa-shield-halved text-lg"></i>
                        <span>Login as Admin &amp; Go to Admin Panel</span>
                    </button>
                    <p class="text-center text-[10px] text-emerald-400 mt-1.5">admin@khanya.test (one-click access to /admin)</p>
                </div>

                <div id="login-error" class="hidden mt-4 p-3 bg-red-900/30 border border-red-700 text-red-400 text-sm rounded-2xl"></div>

                <div class="mt-6 text-center">
                    <p class="text-xs text-zinc-500">
                        This is a protected system. Only authorized users can access.
                    </p>
                </div>
            </div>

            <div class="text-center mt-6">
                <p class="text-xs text-zinc-500">© Khanya Test Maker 2026</p>
            </div>
        </div>
    </div>

    <script>
        // If already logged in, go straight to the right place
        (function() {
            try {
                const raw = localStorage.getItem('khanya_user');
                if (raw) {
                    const user = JSON.parse(raw);
                    if (user && user.email) {
                        if (user.role === 'admin') {
                            window.location.replace('/admin');
                        } else {
                            window.location.replace('/');
                        }
                    }
                }
            } catch (e) {}
        })();

        // One-click admin login for easy access (sets localStorage directly)
        function quickAdminLogin() {
            const adminUser = {
                email: 'admin@khanya.test',
                active: true,
                role: 'admin'
            };
            localStorage.setItem('khanya_user', JSON.stringify(adminUser));
            console.log('%c[Khanya] Quick admin login - localStorage set, redirecting to /admin', 'color:#22c55e');
            window.location.href = '/admin';
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Store user info (including role for admin access)
                    const userData = {
                        email: data.email,
                        active: data.active,
                        role: data.role || 'user'
                    };
                    localStorage.setItem('khanya_user', JSON.stringify(userData));
                    
                    // For admin users, go straight to admin panel
                    if (userData.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    errorEl.textContent = data.message || 'Login failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Unable to connect to server. Please try again.';
                errorEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
