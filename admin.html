        function getCurrentUser() {
            try {
                return JSON.parse(localStorage.getItem('khanya_user') || 'null');
            } catch (e) {
                return null;
            }
        }

        function authHeaders() {
            var user = getCurrentUser() || {};
            var headers = {
                'Content-Type': 'application/json',
                'X-User-Email': user.email || ''
            };
            if (user.token) headers['Authorization'] = 'Bearer ' + user.token;
            return headers;
        }

        function showLoggedInUser() {
            var user = getCurrentUser();
            var el = document.getElementById('current-user');
            if (el && user) {
                el.innerHTML = '<i class="fa-solid fa-user-check"></i> Logged in as <span class="font-mono">' + user.email + '</span>';
            }
        }

        async function loadUsers() {
            var tbody = document.getElementById('users-table');
            tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-zinc-500">Loading users...</td></tr>';

            try {
                var res = await fetch('/api/admin/users', { headers: authHeaders() });
                var data = await res.json();

                if (res.status === 403) {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-red-400">Admin access required. Sign in with an admin email.</td></tr>';
                    return;
                }
                if (!res.ok) {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-red-400">' + (data.message || 'Failed to load users') + '</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-zinc-500">No users yet.</td></tr>';
                    return;
                }

                data.users.forEach(function (user) {
                    var tr = document.createElement('tr');
                    tr.className = 'hover:bg-zinc-800/50';
                    var statusColor = user.active ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400';
                    var statusText = user.active ? 'Active' : 'Inactive';
                    var btnClass = user.active ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700';
                    var btnLabel = user.active ? 'Deactivate' : 'Activate';
                    tr.innerHTML =
                        '<td class="py-3 px-4 font-mono text-sm">' + user.email + '</td>' +
                        '<td class="py-3 px-4"><span class="px-3 py-0.5 text-xs rounded-full ' + statusColor + '">' + statusText + '</span></td>' +
                        '<td class="py-3 px-4 text-xs text-zinc-400">' + (user.role || 'user') + '</td>' +
                        '<td class="py-3 px-4 text-xs text-zinc-400">' + (user.added_at || '—') + '</td>' +
                        '<td class="py-3 px-4 text-right">' +
                            '<button onclick="toggleUser(\'' + user.email + '\', ' + !!user.active + ')" class="px-3 py-1 text-xs rounded-xl text-white ' + btnClass + '">' + btnLabel + '</button>' +
                        '</td>';
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-red-400">Cannot reach /api/admin/users. Deploy app.py as a Render Web Service.</td></tr>';
            }
        }

        document.getElementById('add-user-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            var input = document.getElementById('new-email');
            var role = document.getElementById('new-role').value;
            var errorEl = document.getElementById('add-error');
            var okEl = document.getElementById('add-ok');
            errorEl.classList.add('hidden');
            okEl.classList.add('hidden');

            var email = input.value.trim().toLowerCase();
            if (!email) return;

            try {
                var res = await fetch('/api/admin/add-user', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ email: email, role: role })
                });
                var data = await res.json();
                if (res.ok) {
                    input.value = '';
                    okEl.textContent = data.message || 'Added. Activate the email so they can sign in.';
                    okEl.classList.remove('hidden');
                    loadUsers();
                } else {
                    errorEl.textContent = data.message || 'Failed to add user';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Failed to add user — is the Flask API running?';
                errorEl.classList.remove('hidden');
            }
        });

        async function toggleUser(email, currentActive) {
            var action = currentActive ? 'deactivate' : 'activate';
            if (!confirm('Are you sure you want to ' + action + ' ' + email + '?')) return;

            try {
                var res = await fetch('/api/admin/toggle-user', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ email: email, active: !currentActive })
                });
                var data = {};
                try { data = await res.json(); } catch (e) {}
                if (res.ok) {
                    loadUsers();
                } else {
                    alert(data.message || 'Failed to update user status');
                }
            } catch (err) {
                alert('Error updating user');
            }
        }

        function logout() {
            localStorage.removeItem('khanya_user');
            window.location.href = 'login.html';
        }
