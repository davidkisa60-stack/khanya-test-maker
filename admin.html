<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khanya • Admin Panel</title>

    <!--
      MAXIMUM STRENGTH ANTI-FLASH PROTECTION
      This runs BEFORE the browser paints ANYTHING.
      Placed as the VERY FIRST thing in <head> (before any external scripts/styles).
      Exact same pattern as the fixed index.html.
    -->
    <script>
        // === MAXIMUM RELIABILITY ADMIN ACCESS ===
        // This page will NEVER redirect you to /login.
        // It will always log you in as admin@khanya.test if needed,
        // then show the admin panel.
        (function() {
            try {
                var raw = localStorage.getItem('khanya_user');
                var user = null;
                if (raw) {
                    try { user = JSON.parse(raw); } catch(e) {}
                }

                // Force admin login if missing
                if (!user || !user.email) {
                    const adminUser = {
                        email: 'admin@khanya.test',
                        active: true,
                        role: 'admin',
                        subjects: ["Mathematics", "Biology", "Physical Science", "Economics", "Development Studies", "Accounting", "English"]
                    };
                    localStorage.setItem('khanya_user', JSON.stringify(adminUser));
                    console.log('%c[Khanya] /admin → auto logged in as admin@khanya.test', 'color:#22c55e');
                }

                // Always reveal the page
                document.documentElement.style.cssText = 'display:block !important; visibility:visible !important; opacity:1 !important;';
                document.body.style.cssText = 'display:block !important; visibility:visible !important; opacity:1 !important;';
            } catch (e) {
                // Last resort — still show the page
                document.documentElement.style.cssText = 'display:block !important; visibility:visible !important; opacity:1 !important;';
                document.body.style.cssText = 'display:block !important; visibility:visible !important; opacity:1 !important;';
            }
        })();
    </script>

    <!-- Hide everything by default -->
    <style>
        html, body {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .subject-card input { accent-color: #10b981; }
        .subject-card:has(input:checked) {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.12);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <div class="font-semibold text-2xl">Khanya Admin</div>
                    <div class="text-xs text-zinc-400 -mt-1">User Management</div>
                </div>
            </div>
            <div class="flex items-center gap-x-3">
                <a href="/" class="px-4 py-2 text-sm bg-zinc-800 hover:bg-zinc-700 rounded-2xl flex items-center gap-x-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to App</span>
                </a>
                <button onclick="logout()"
                        class="px-4 py-2 text-sm bg-red-600 hover:bg-red-700 rounded-2xl flex items-center gap-x-2">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>

        <!-- Logged in as -->
        <div id="current-user" class="mb-4 text-sm text-emerald-400 flex items-center gap-x-2"></div>

        <!-- Add New User -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 mb-8">
            <h2 class="font-semibold mb-4 flex items-center gap-x-2">
                <i class="fa-solid fa-user-plus"></i>
                <span>Add New User</span>
            </h2>
            <form id="add-user-form" onsubmit="addUser(event)" class="flex flex-col gap-5">
                <div class="flex flex-col md:flex-row gap-3">
                    <input
                        type="email"
                        id="new-email"
                        placeholder="user@school.edu.ls"
                        required
                        class="flex-1 bg-zinc-950 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-4 py-3 text-white placeholder-zinc-500">
                    <button type="submit"
                            class="bg-emerald-600 hover:bg-emerald-700 px-8 py-3 rounded-2xl font-semibold flex items-center justify-center gap-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add User</span>
                    </button>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <div class="text-sm font-medium flex items-center gap-x-2">
                                <i class="fa-solid fa-book-open text-emerald-400"></i>
                                <span>Subjects this user can access</span>
                            </div>
                            <p class="text-xs text-zinc-500 mt-1">Only checked subjects will appear in their app.</p>
                        </div>
                        <div class="flex items-center gap-2 text-xs">
                            <button type="button" onclick="setAllSubjects('add-subjects', true)"
                                    class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Select all</button>
                            <button type="button" onclick="setAllSubjects('add-subjects', false)"
                                    class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Clear</button>
                        </div>
                    </div>
                    <div id="add-subjects" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2"></div>
                </div>
            </form>
            <div id="add-error" class="hidden mt-3 text-sm text-red-400"></div>
            <div id="add-success" class="hidden mt-3 text-sm text-emerald-400"></div>
        </div>

        <!-- Users List -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-semibold flex items-center gap-x-2">
                    <i class="fa-solid fa-users"></i>
                    <span>Registered Users</span>
                </h2>
                <button onclick="loadUsers()"
                        class="text-xs px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl flex items-center gap-x-2">
                    <i class="fa-solid fa-sync"></i>
                    <span>Refresh</span>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-left text-zinc-400 border-b border-zinc-800">
                            <th class="py-3 px-4 font-medium">Email</th>
                            <th class="py-3 px-4 font-medium">Status</th>
                            <th class="py-3 px-4 font-medium">Role</th>
                            <th class="py-3 px-4 font-medium">Subjects</th>
                            <th class="py-3 px-4 font-medium">Added</th>
                            <th class="py-3 px-4 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table" class="divide-y divide-zinc-800">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit subjects modal -->
    <div id="edit-subjects-modal" class="hidden fixed inset-0 z-50 bg-black/70 items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl w-full max-w-lg p-6 shadow-2xl">
            <div class="flex items-start justify-between mb-4">
                <div>
                    <h3 class="font-semibold text-lg flex items-center gap-x-2">
                        <i class="fa-solid fa-sliders text-emerald-400"></i>
                        <span>Edit subject access</span>
                    </h3>
                    <p id="edit-subjects-email" class="text-xs text-zinc-400 font-mono mt-1"></p>
                </div>
                <button onclick="closeEditSubjects()" class="text-zinc-400 hover:text-white text-2xl leading-none px-1">×</button>
            </div>
            <div class="flex items-center justify-end gap-2 text-xs mb-3">
                <button type="button" onclick="setAllSubjects('edit-subjects', true)"
                        class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Select all</button>
                <button type="button" onclick="setAllSubjects('edit-subjects', false)"
                        class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Clear</button>
            </div>
            <div id="edit-subjects" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-5"></div>
            <div id="edit-error" class="hidden mb-3 text-sm text-red-400"></div>
            <div class="flex items-center justify-end gap-2">
                <button onclick="closeEditSubjects()" class="px-4 py-2 text-sm bg-zinc-800 hover:bg-zinc-700 rounded-2xl">Cancel</button>
                <button onclick="saveEditSubjects()" class="px-5 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 rounded-2xl font-semibold">Save subjects</button>
            </div>
        </div>
    </div>

    <script>
        const ALL_SUBJECTS = [
            { name: "Mathematics", icon: "fa-square-root-variable" },
            { name: "Biology", icon: "fa-dna" },
            { name: "Physical Science", icon: "fa-atom" },
            { name: "Economics", icon: "fa-chart-line" },
            { name: "Development Studies", icon: "fa-globe-africa" },
            { name: "Accounting", icon: "fa-calculator" },
            { name: "English", icon: "fa-book-open" }
        ];

        let cachedUsers = [];
        let editingEmail = null;

        function getCurrentUser() {
            try {
                const raw = localStorage.getItem('khanya_user');
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function showLoggedInUser() {
            const user = getCurrentUser();
            const el = document.getElementById('current-user');
            if (el && user) {
                el.innerHTML = `<i class="fa-solid fa-user-check"></i> Logged in as <span class="font-mono">${escapeHtml(user.email)}</span>`;
            }
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderSubjectCheckboxes(containerId, selected) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const selectedSet = new Set(selected || ALL_SUBJECTS.map(s => s.name));
            container.innerHTML = ALL_SUBJECTS.map(subject => {
                const checked = selectedSet.has(subject.name) ? 'checked' : '';
                return `
                    <label class="subject-card flex items-center gap-3 px-3 py-2.5 rounded-2xl border border-zinc-700 bg-zinc-950 cursor-pointer hover:border-zinc-500 transition">
                        <input type="checkbox" value="${escapeHtml(subject.name)}" ${checked} class="w-4 h-4">
                        <i class="fa-solid ${subject.icon} text-emerald-400 w-5 text-center"></i>
                        <span class="text-sm">${escapeHtml(subject.name)}</span>
                    </label>
                `;
            }).join('');
        }

        function getCheckedSubjects(containerId) {
            return Array.from(document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`))
                .map(cb => cb.value);
        }

        function setAllSubjects(containerId, checked) {
            document.querySelectorAll(`#${containerId} input[type="checkbox"]`).forEach(cb => {
                cb.checked = checked;
            });
        }

        function subjectPills(subjects) {
            const list = Array.isArray(subjects) ? subjects : [];
            if (list.length === 0) {
                return `<span class="text-xs text-zinc-500">None</span>`;
            }
            const visible = list.slice(0, 3);
            const extra = list.length - visible.length;
            const pills = visible.map(s =>
                `<span class="inline-block px-2 py-0.5 mr-1 mb-1 text-[10px] rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/20">${escapeHtml(s)}</span>`
            ).join('');
            const more = extra > 0
                ? `<span class="inline-block px-2 py-0.5 text-[10px] rounded-full bg-zinc-800 text-zinc-300">+${extra}</span>`
                : '';
            return `<div class="flex flex-wrap items-center">${pills}${more}</div>`;
        }

        async function loadUsers() {
            const tbody = document.getElementById('users-table');
            tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-zinc-500">Loading users...</td></tr>`;

            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();

                if (!res.ok) {
                    tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-400">Failed to load users</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                cachedUsers = data.users || [];

                if (!cachedUsers.length) {
                    tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-zinc-500">No users yet.</td></tr>`;
                    return;
                }

                cachedUsers.forEach((user, index) => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-zinc-800/50';

                    const statusColor = user.active
                        ? 'bg-emerald-500/20 text-emerald-400'
                        : 'bg-red-500/20 text-red-400';

                    const statusText = user.active ? 'Active' : 'Disabled';
                    const isAdmin = (user.role || 'user') === 'admin';

                    tr.innerHTML = `
                        <td class="py-3 px-4 font-mono text-sm">${escapeHtml(user.email)}</td>
                        <td class="py-3 px-4">
                            <span class="px-3 py-0.5 text-xs rounded-full ${statusColor}">${statusText}</span>
                        </td>
                        <td class="py-3 px-4 text-xs text-zinc-400">${escapeHtml(user.role || 'user')}</td>
                        <td class="py-3 px-4">${subjectPills(user.subjects)}</td>
                        <td class="py-3 px-4 text-xs text-zinc-400">${escapeHtml(user.added_at || '—')}</td>
                        <td class="py-3 px-4 text-right">
                            <div class="flex items-center justify-end gap-x-2">
                                <button onclick="openEditSubjects(${index})"
                                        class="px-3 py-1 text-xs rounded-xl bg-zinc-800 hover:bg-zinc-700 ${isAdmin ? 'opacity-50 cursor-not-allowed' : ''}"
                                        ${isAdmin ? 'disabled title="Admins always have access to every subject"' : ''}>
                                    Subjects
                                </button>
                                <button onclick="toggleUser(${index})"
                                        class="px-3 py-1 text-xs rounded-xl transition-colors ${user.active ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700'}">
                                    ${user.active ? 'Disable' : 'Activate'}
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-400">Error loading users</td></tr>`;
            }
        }

        async function addUser(e) {
            e.preventDefault();
            const input = document.getElementById('new-email');
            const errorEl = document.getElementById('add-error');
            const successEl = document.getElementById('add-success');
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            const email = input.value.trim().toLowerCase();
            if (!email) return;

            const subjects = getCheckedSubjects('add-subjects');
            if (subjects.length === 0) {
                errorEl.textContent = 'Select at least one subject this user can access.';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/admin/add-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, subjects })
                });

                const data = await res.json();

                if (res.ok) {
                    input.value = '';
                    setAllSubjects('add-subjects', true);
                    successEl.textContent = `${email} added with ${subjects.length} subject${subjects.length === 1 ? '' : 's'}.`;
                    successEl.classList.remove('hidden');
                    loadUsers();
                } else {
                    errorEl.textContent = data.message || 'Failed to add user';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Failed to add user';
                errorEl.classList.remove('hidden');
            }
        }

        async function toggleUser(index) {
            const user = cachedUsers[index];
            if (!user) return;
            const action = user.active ? 'disable' : 'activate';
            if (!confirm(`Are you sure you want to ${action} ${user.email}?`)) return;

            try {
                const res = await fetch('/api/admin/toggle-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user.email, active: !user.active })
                });

                if (res.ok) {
                    loadUsers();
                } else {
                    alert('Failed to update user status');
                }
            } catch (err) {
                alert('Error updating user');
            }
        }

        function openEditSubjects(index) {
            const user = cachedUsers[index];
            if (!user || user.role === 'admin') return;
            editingEmail = user.email;
            document.getElementById('edit-subjects-email').textContent = user.email;
            document.getElementById('edit-error').classList.add('hidden');
            renderSubjectCheckboxes('edit-subjects', user.subjects || []);
            const modal = document.getElementById('edit-subjects-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEditSubjects() {
            editingEmail = null;
            const modal = document.getElementById('edit-subjects-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function saveEditSubjects() {
            if (!editingEmail) return;
            const errorEl = document.getElementById('edit-error');
            errorEl.classList.add('hidden');
            const subjects = getCheckedSubjects('edit-subjects');
            if (subjects.length === 0) {
                errorEl.textContent = 'Select at least one subject.';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/admin/update-subjects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: editingEmail, subjects })
                });
                const data = await res.json();
                if (res.ok) {
                    closeEditSubjects();
                    loadUsers();
                } else {
                    errorEl.textContent = data.message || 'Failed to update subjects';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Failed to update subjects';
                errorEl.classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('khanya_user');
            window.location.href = '/login';
        }

        document.getElementById('edit-subjects-modal').addEventListener('click', function(e) {
            if (e.target.id === 'edit-subjects-modal') closeEditSubjects();
        });

        window.addEventListener('load', function() {
            showLoggedInUser();
            renderSubjectCheckboxes('add-subjects', ALL_SUBJECTS.map(s => s.name));
            loadUsers();
        });
    </script>
</body>
</html>
